services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: hono-backend
    ports:
      - "${BACKEND_PORT}:3000" 
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
  frontend:
    build:
      context: ./next-frontend
      dockerfile: Dockerfile
      target: dev
    container_name: next-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./next-frontend:/app
      - /app/node_modules
    env_file:
      - .env
  db:
    image: postgres:16-alpine
    container_name: app-db
    ports:
      - "${DB_PORT}:5432"
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
